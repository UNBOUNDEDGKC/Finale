<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1</title>
</head>
<script>
    let targets=7
    let timer=window.sessionStorage.getItem("timer");
    let lvl=window.sessionStorage.getItem("level");
    if (lvl!=9){
        let lvl=window.sessionStorage.setItem("level",1);
        window.location.href="https://docs.google.com/document/d/1chZ1yNrr0CRYmG5zGEMvOQIlBCYEAz-nFHND4TV74i8/edit?tab=t.0";
    }

    setInterval(function(){
        timer--
        window.sessionStorage.setItem("timer",timer)
        document.getElementById("timer").innerHTML=timer
        if (targets<=0){
            lvl++
            window.sessionStorage.setItem("level",lvl)
            window.location.href="level10.html";
        }
        if (timer<=0&&targets>0){
            window.sessionStorage.setItem("timer",60)
            window.location="index.html";
        }
    }, 1000);
</script>
<style>
    .centered{
        display: flex;
        align-self: center;
        justify-self: center;
        text-align: center;
    }
    .grid{
        display: grid;
        grid-template-columns: repeat(3, 40px);
        gap: 8px;
        justify-self: center;
        align-self: center;
    }
    .grid button{
        width: 40px;
        height: 40px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
<body>
    <h1 class="centered">You're in a crawling space with another trapdoor in front of you. You attempt to pick it's lock with your dagger. You hear people behind you.</h1>
    <br>
    <p class="centered" id="timer">Loading...</p>
    <br>
    <div class="grid">
        <button id="1" onclick="
            if (this.innerText=='X'){
                this.innerText='';
                targets--;

</html>
